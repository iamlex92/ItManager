name: Android smoke test

# Starts the app on an emulator: catches crashes at launch that unit tests and assembleDebug cannot see.
on:
  push:
    paths-ignore: ["server/**", "**.md"]
  pull_request:
    paths-ignore: ["server/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: Launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3000M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 14
