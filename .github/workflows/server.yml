name: server

# Tests run on PRs only (master is always a merged, already tested PR).
on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netadmin
          POSTGRES_PASSWORD: netadmin
          POSTGRES_DB: netadmin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netadmin" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://netadmin:netadmin@localhost:5432/netadmin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e '.[dev]' ruff
      - run: ruff check app tests alembic
      - run: pytest -q
