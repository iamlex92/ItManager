name: Android

# PRs: tests + debug build (Linux only). Publishing test/release APKs: only on a v* tag or by hand.
on:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle*", "gradle.properties", "gradlew*", ".github/workflows/android.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itmanager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # master always has one ready-to-install test build: open the release page on the phone and tap the APK.
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk itmanager-debug.apk
          notes="Тестовая сборка, коммит ${GITHUB_SHA::7}, сборка №${GITHUB_RUN_NUMBER}. Ставится поверх предыдущей."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest itmanager-debug.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest itmanager-debug.apk --prerelease \
              --title "ItManager: тестовая сборка" --notes "$notes" --target "$GITHUB_SHA"
          fi

      # Signed release build, only when the release key is configured as repository secrets:
      # RELEASE_KEYSTORE_BASE64 (base64 of the .jks), RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      # Without them master keeps publishing only the test build above.
      - name: Signed release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::notice::Release key secrets are not set: only the test build is published. See README, «Релизная подпись»."
            exit 0
          fi
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RELEASE_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk itmanager-release.apk
          notes="Рабочая сборка, коммит ${GITHUB_SHA::7}, сборка №${GITHUB_RUN_NUMBER}. Подписана релизным ключом."
          if gh release view android-release >/dev/null 2>&1; then
            gh release upload android-release itmanager-release.apk --clobber
            gh release edit android-release --notes "$notes"
          else
            gh release create android-release itmanager-release.apk \
              --title "ItManager: рабочая сборка" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
