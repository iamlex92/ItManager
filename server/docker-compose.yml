# Local / on-prem stack: PostgreSQL + API server.
#   cp .env.example .env   # then set API_TOKEN
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netadmin
      POSTGRES_USER: netadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netadmin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netadmin -d netadmin"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://netadmin:${POSTGRES_PASSWORD:-netadmin}@db:5432/netadmin
    ports:
      - "8000:8000"
      # SNMP traps: point switches at <server>:162. The container listens on
      # 1162 because it runs unprivileged (set TRAP_LISTEN_PORT=1162).
      - "162:1162/udp"

volumes:
  pgdata:
